name: CI — Contract Clause Env

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_reward_range.py -v --tb=short

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t contract-clause-env-ci .

      - name: Start container and verify health
        run: |
          docker run -d --name ccenv \
            -p 7860:7860 \
            -e API_BASE_URL=https://api.openai.com/v1 \
            -e MODEL_NAME=gpt-4o-mini \
            -e HF_TOKEN=test_token \
            contract-clause-env-ci
          sleep 8
          curl -f http://localhost:7860/health
          curl -s -X POST http://localhost:7860/reset \
            -H "Content-Type: application/json" \
            -d '{"task_id":"easy"}' | python -m json.tool
